name: Build and Release Multi-Platform Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.10.1)'
        required: false
        default: 'v0.10.1'
      platform:
        description: 'Target Platform to build (windows, all, macos, linux)'
        required: false
        default: 'windows'

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (x64)
  # ==========================================
  build-windows:
    name: Build Windows (windows_amd64)
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'standalone-apps/app-lab-desktop/go.mod'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Windows build tools
        run: |
          choco install wget jq nsis 7zip unzip -y --no-progress

      - name: Set up Yarn & Environment
        shell: bash
        run: |
          touch .env
          corepack enable
          yarn set version 3.8.7
          yarn install

      - name: Download Bundled Resources
        shell: bash
        run: |
          chmod +x standalone-apps/app-lab-desktop/frontend/scripts/download.sh
          bash standalone-apps/app-lab-desktop/frontend/scripts/download.sh windows_amd64

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Frontend
        run: |
          yarn workspace @bcmi-labs/app-lab-desktop build

      - name: Build Wails App (Windows)
        working-directory: standalone-apps/app-lab-desktop
        run: |
          wails build -s -skipbindings -m -platform windows/amd64

      - name: Package Output Artifact (Windows)
        shell: bash
        run: |
          mkdir -p dist
          cp standalone-apps/app-lab-desktop/build/bin/ArduinoAppLab.exe dist/ArduinoAppLab-Windows-x64.exe
          cd dist
          if command -v 7z >/dev/null 2>&1; then
            7z a ArduinoAppLab-Windows-x64.zip ArduinoAppLab-Windows-x64.exe
          elif command -v zip >/dev/null 2>&1; then
            zip ArduinoAppLab-Windows-x64.zip ArduinoAppLab-Windows-x64.exe
          else
            powershell.exe -Command "Compress-Archive -Path ArduinoAppLab-Windows-x64.exe -DestinationPath ArduinoAppLab-Windows-x64.zip"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: dist/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.10.1' }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # MACOS BUILD (Apple Silicon arm64)
  # ==========================================
  build-macos-arm64:
    name: Build macOS (darwin_arm64)
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'standalone-apps/app-lab-desktop/go.mod'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install macOS build dependencies
        run: |
          brew install wget jq

      - name: Set up Yarn & Environment
        shell: bash
        run: |
          touch .env
          corepack enable
          yarn set version 3.8.7
          yarn install

      - name: Download Bundled Resources
        shell: bash
        run: |
          chmod +x standalone-apps/app-lab-desktop/frontend/scripts/download.sh
          bash standalone-apps/app-lab-desktop/frontend/scripts/download.sh darwin_arm64

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Frontend
        run: |
          yarn workspace @bcmi-labs/app-lab-desktop build

      - name: Build Wails App (macOS arm64)
        working-directory: standalone-apps/app-lab-desktop
        run: |
          wails build -s -skipbindings -m -platform darwin/arm64

      - name: Package Output Artifact (macOS)
        shell: bash
        run: |
          mkdir -p dist
          cp standalone-apps/app-lab-desktop/build/bin/*.dmg dist/ || true
          cp -r standalone-apps/app-lab-desktop/build/bin/*.app dist/ || true
          cd dist && zip -r ArduinoAppLab-macOS-arm64.zip ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: dist/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.10.1' }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # MACOS BUILD (Intel amd64)
  # ==========================================
  build-macos-amd64:
    name: Build macOS (darwin_amd64)
    runs-on: macos-13
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'standalone-apps/app-lab-desktop/go.mod'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install macOS build dependencies
        run: |
          brew install wget jq

      - name: Set up Yarn & Environment
        shell: bash
        run: |
          touch .env
          corepack enable
          yarn set version 3.8.7
          yarn install

      - name: Download Bundled Resources
        shell: bash
        run: |
          chmod +x standalone-apps/app-lab-desktop/frontend/scripts/download.sh
          bash standalone-apps/app-lab-desktop/frontend/scripts/download.sh darwin_amd64

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Frontend
        run: |
          yarn workspace @bcmi-labs/app-lab-desktop build

      - name: Build Wails App (macOS amd64)
        working-directory: standalone-apps/app-lab-desktop
        run: |
          wails build -s -skipbindings -m -platform darwin/amd64

      - name: Package Output Artifact (macOS)
        shell: bash
        run: |
          mkdir -p dist
          cp standalone-apps/app-lab-desktop/build/bin/*.dmg dist/ || true
          cp -r standalone-apps/app-lab-desktop/build/bin/*.app dist/ || true
          cd dist && zip -r ArduinoAppLab-macOS-amd64.zip ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-amd64
          path: dist/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.10.1' }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # LINUX BUILD (x64)
  # ==========================================
  build-linux:
    name: Build Linux (linux_amd64)
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'standalone-apps/app-lab-desktop/go.mod'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential pkg-config wget jq

      - name: Set up Yarn & Environment
        shell: bash
        run: |
          touch .env
          corepack enable
          yarn set version 3.8.7
          yarn install

      - name: Download Bundled Resources
        shell: bash
        run: |
          chmod +x standalone-apps/app-lab-desktop/frontend/scripts/download.sh
          bash standalone-apps/app-lab-desktop/frontend/scripts/download.sh linux_amd64

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Frontend
        run: |
          yarn workspace @bcmi-labs/app-lab-desktop build

      - name: Build Wails App (Linux)
        working-directory: standalone-apps/app-lab-desktop
        run: |
          wails build -s -skipbindings -m -platform linux/amd64 -tags webkit2_41

      - name: Package Output Artifact (Linux)
        shell: bash
        run: |
          mkdir -p dist
          cp standalone-apps/app-lab-desktop/build/bin/ArduinoAppLab dist/ArduinoAppLab-Linux-x64
          cd dist && tar -czvf ArduinoAppLab-Linux-x64.tar.gz ArduinoAppLab-Linux-x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-amd64
          path: dist/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.10.1' }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
